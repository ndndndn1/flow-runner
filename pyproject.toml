[project]
name = "flow-runner"
version = "0.1.1"
description = "Generic fail-closed DAG runner with observable data movement"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jmespath>=1.0,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pymongo>=4.10,<5",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[project.scripts]
flow-runner = "flow_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_runner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
